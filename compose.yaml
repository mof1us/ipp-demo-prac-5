services:
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/contacts
      DB_USERNAME: contacts
      DB_PASSWORD: contacts
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contacts
      POSTGRES_USER: contacts
      POSTGRES_PASSWORD: contacts
    ports:
      - "5151:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contacts -d contacts"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
